<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | SheherSaathi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-compass-navigational"></i> Sheher<span>Saathi</span></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn"><i class="fas fa-moon"></i></button>
                <a href="index.html" class="btn btn-outline-nav">Go to App</a>
            </div>
        </div>
    </nav>

    <div class="app-container" style="justify-content: center;">
        <main class="main-content" style="max-width: 800px; margin-left: 0;">
            <div class="tab-header text-center">
                <h2><i class="fa-solid fa-headset text-primary"></i> Contact Support</h2>
                <p>Fastest response times for verification, listings, and queries.</p>
            </div>

            <div class="grid-layout mb-20">
                <a href="mailto:supportpgkhojo@gmail.com" class="card text-center" style="text-decoration:none; color:inherit;">
                    <i class="fa-solid fa-envelope fa-2x text-primary mb-10"></i>
                    <h3>Email Support</h3>
                    <p class="text-muted text-sm">supportpgkhojo@gmail.com</p>
                </a>
                <a href="https://wa.me/919534196255" target="_blank" class="card text-center" style="text-decoration:none; color:inherit;">
                    <i class="fa-brands fa-whatsapp fa-2x text-success mb-10"></i>
                    <h3>WhatsApp</h3>
                    <p class="text-muted text-sm">+91 95341 96255</p>
                </a>
            </div>

            <div class="card">
                <h3>Send a direct message</h3>
                <div class="form-group style-top">
                    <input type="text" id="cfName" placeholder="Full Name" class="form-input">
                </div>
                <div class="form-group">
                    <input type="email" id="cfEmail" placeholder="Email Address" class="form-input">
                </div>
                <div class="form-group">
                    <textarea id="cfMsg" placeholder="Describe your issue or listing request..." class="form-input" style="height: 120px; resize: vertical;"></textarea>
                </div>
                <button class="btn btn-primary w-100" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i> Submit Ticket</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        function sendMsg() {
            const n = document.getElementById('cfName').value.trim();
            const e = document.getElementById('cfEmail').value.trim();
            const m = document.getElementById('cfMsg').value.trim();
            if(!n || !e || !m) return alert('⚠️ Complete all fields before submission.');
            alert('✅ Ticket logged! Operations team will reach out within 2-4 hours.');
            document.querySelectorAll('.form-input').forEach(input => input.value = '');
        }
    </script>
</body>
</html>
