<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | SheherSaathi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 900: '#312e81' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50">
    <!-- Navigation -->
    <nav class="bg-white/80 backdrop-blur-lg border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-brand-900">
                    <div class="bg-brand-600 text-white p-2 rounded-lg"><i class="fa-solid fa-user-tie"></i></div>
                    Admin<span class="text-brand-600">Panel</span>
                </a>
                <div class="flex items-center gap-4">
                    <button id="theme-toggle" class="p-2 text-slate-500 hover:text-brand-600 transition rounded-full hover:bg-slate-100">
                        <i class="fas fa-moon text-lg"></i>
                    </button>
                    <a href="index.html" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg font-medium transition">
                        Exit Admin
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-6 md:p-10">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-slate-800 mb-2">
                    <i class="fa-solid fa-square-plus text-brand-600"></i> Add New PG/Flat
                </h2>
                <p class="text-slate-600">Deploy a new verified listing directly to the database.</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Property Name *</label>
                    <input type="text" id="pg-name" placeholder="Enter Property Name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition outline-none">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">City Hub *</label>
                        <select id="pg-city" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition outline-none">
                            <option value="Bhopal">Bhopal</option>
                            <option value="Patna">Patna</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Mumbai">Mumbai</option>
                            <option value="Pune">Pune</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Monthly Rent (₹) *</label>
                        <input type="number" id="pg-price" placeholder="e.g., 5000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Location *</label>
                    <input type="text" id="pg-location" placeholder="e.g., MP Nagar Zone 2" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Contact Number *</label>
                    <input type="tel" id="pg-contact" placeholder="+91 98765 43210" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Image URL</label>
                    <input type="text" id="pg-image" placeholder="https://images.unsplash.com/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition outline-none" oninput="previewImg()">
                </div>

                <div id="preview-container" style="display:none;" class="mt-4">
                    <img id="preview" src="" alt="Preview" class="w-full h-48 object-cover rounded-xl border border-slate-200">
                </div>

                <div class="flex gap-3 pt-4">
                    <button class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition shadow-md" onclick="addPG()">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Publish Listing
                    </button>
                    <button class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 rounded-xl transition" onclick="resetForm()">
                        <i class="fa-solid fa-rotate-left mr-2"></i> Clear Form
                    </button>
                </div>
            </div>
        </div>

        <!-- Recent Listings -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 mt-8">
            <h3 class="text-2xl font-bold text-slate-800 mb-6">
                <i class="fa-solid fa-list text-brand-600 mr-2"></i> Recent Listings
            </h3>
            <div id="recent-listings" class="space-y-4">
                <p class="text-slate-500 text-center py-8">No custom listings yet. Add your first one above!</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        function previewImg() {
            const url = document.getElementById('pg-image').value;
            const preview = document.getElementById('preview');
            const container = document.getElementById('preview-container');
            if(url) { 
                container.style.display = 'block'; 
                preview.src = url; 
            } else { 
                container.style.display = 'none'; 
            }
        }

        function resetForm() {
            document.querySelectorAll('input, select').forEach(el => el.value = '');
            document.getElementById('preview-container').style.display = 'none';
        }

        function addPG() {
            const n = document.getElementById('pg-name').value.trim();
            const c = document.getElementById('pg-city').value;
            const p = parseInt(document.getElementById('pg-price').value);
            const loc = document.getElementById('pg-location').value.trim();
            const contact = document.getElementById('pg-contact').value.trim();
            
            if(!n || !p || !loc || !contact) return alert("⚠️ Please fill all required fields.");

            const newListing = { 
                name: n, 
                city: c, 
                price: p, 
                loc: loc,
                contact: contact,
                ac: true, 
                wifi: true, 
                food: false, 
                brokerFree: true,
                img: document.getElementById('pg-image').value || 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80'
            };
            
            flatsData.unshift(newListing);
            localStorage.setItem("ss_flats", JSON.stringify(flatsData));
            
            alert("✅ Listing Published Successfully!");
            resetForm();
            displayRecentListings();
        }

        function displayRecentListings() {
            const container = document.getElementById('recent-listings');
            const customListings = flatsData.slice(0, 5);
            
            if(customListings.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center py-8">No listings yet.</p>';
                return;
            }
            
            container.innerHTML = customListings.map((listing, idx) => `
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-slate-800">${listing.name}</h4>
                            <p class="text-sm text-slate-600 mt-1"><i class="fa-solid fa-location-dot mr-1"></i> ${listing.loc}, ${listing.city}</p>
                            <p class="text-sm text-slate-600"><i class="fa-solid fa-phone mr-1"></i> ${listing.contact}</p>
                        </div>
                        <span class="font-bold text-brand-600">₹${listing.price}/mo</span>
                    </div>
                </div>
            `).join('');
        }
        
        document.addEventListener('DOMContentLoaded', displayRecentListings);
    </script>
</body>
</html>
